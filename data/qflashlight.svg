<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
SPDX-FileCopyrightText: 2017-2026 Ingo Ruhnke <grumbel@gmail.com>
SPDX-License-Identifier: GPL-3.0-or-later

QFlashlight application icon, drawn in the style of the GNOME 2 / Tango
icon theme (Tango palette, soft gradients, dark outlines, inner highlights).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="48" height="48"
     viewBox="0 0 48 48">
  <title>QFlashlight</title>
  <defs>
    <!-- Drop shadow -->
    <radialGradient id="shadow" cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(15,40) rotate(-45) scale(14,3.5)">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Light beam (local flashlight coordinates, pointing along +x) -->
    <linearGradient id="beam" x1="24" y1="0" x2="50" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fce94f" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fce94f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fce94f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="25" cy="0" r="9"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fce94f" stop-opacity="0"/>
    </radialGradient>

    <!-- Red body -->
    <linearGradient id="body" x1="0" y1="-3.5" x2="0" y2="3.5"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef2929"/>
      <stop offset="0.25" stop-color="#ff8a8a"/>
      <stop offset="0.5" stop-color="#ef2929"/>
      <stop offset="1" stop-color="#a40000"/>
    </linearGradient>

    <!-- Aluminium parts -->
    <linearGradient id="alu" x1="0" y1="-6.5" x2="0" y2="6.5"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#babdb6"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d3d7cf"/>
      <stop offset="1" stop-color="#888a85"/>
    </linearGradient>
    <linearGradient id="alu-small" x1="0" y1="-3" x2="0" y2="3"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#babdb6"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d3d7cf"/>
      <stop offset="1" stop-color="#888a85"/>
    </linearGradient>

    <!-- Lens -->
    <radialGradient id="lens" cx="24.6" cy="-2" r="6.5"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fce94f"/>
      <stop offset="1" stop-color="#edd400"/>
    </radialGradient>

    <!-- The illuminated "Q" -->
    <linearGradient id="letter" x1="33" y1="6" x2="33" y2="25"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#729fcf"/>
      <stop offset="1" stop-color="#204a87"/>
    </linearGradient>
  </defs>

  <!-- Shadow below the flashlight -->
  <ellipse cx="15" cy="40" rx="14" ry="3.5" transform="rotate(-45 15 40)"
           fill="url(#shadow)" opacity="0.6"/>

  <g transform="translate(5,43) rotate(-45)">
    <!-- Beam of light -->
    <path d="M 25,-6 L 52,-19 L 52,19 L 25,6 Z" fill="url(#beam)"/>
    <circle cx="25" cy="0" r="9" fill="url(#glow)"/>
  </g>

  <!-- Letter Q, lit by the beam -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#204a87" stroke-width="5">
      <circle cx="33" cy="15" r="7"/>
      <path d="M 35.5,18 L 40.5,23.5"/>
    </g>
    <g stroke="url(#letter)" stroke-width="3">
      <circle cx="33" cy="15" r="7"/>
      <path d="M 35.5,18 L 40.5,23.5"/>
    </g>
    <path d="M 27.3,12.5 A 6,6 0 0 1 33,8.5" stroke="#ffffff"
          stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Flashlight, pointing up-right -->
  <g transform="translate(5,43) rotate(-45)" stroke-linejoin="round">
    <!-- Tail cap -->
    <rect x="0.5" y="-3" width="3.5" height="6" rx="1.2"
          fill="url(#alu-small)" stroke="#555753" stroke-width="1"/>
    <!-- Body -->
    <rect x="3" y="-3.5" width="15.5" height="7" rx="1"
          fill="url(#body)" stroke="#a40000" stroke-width="1"/>
    <rect x="4" y="-2.5" width="13.5" height="5" rx="0.5"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Grip rings -->
    <g stroke="#a40000" stroke-width="0.8" stroke-opacity="0.7">
      <path d="M 5.5,-3 V 3"/>
      <path d="M 7.5,-3 V 3"/>
    </g>
    <!-- Switch -->
    <rect x="10.5" y="-5" width="4" height="2" rx="0.9"
          fill="#555753" stroke="#2e3436" stroke-width="0.8"/>
    <!-- Head -->
    <path d="M 18,-3.8 L 23.5,-6.5 L 23.5,6.5 L 18,3.8 Z"
          fill="url(#alu)" stroke="#555753" stroke-width="1"/>
    <!-- Rim -->
    <rect x="22.8" y="-7" width="2.4" height="14" rx="1"
          fill="url(#alu)" stroke="#555753" stroke-width="1"/>
    <!-- Lens -->
    <ellipse cx="25.2" cy="0" rx="1" ry="5.8"
             fill="url(#lens)" stroke="#c4a000" stroke-width="0.6"/>
  </g>
</svg>
